<h3>Upload file</h3>
<form id="upload-form" action="{% url 'file-upload' %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p>
        <label for="upload-file">File:</label>
        <input id="upload-file" type="file" name="file">
    </p>
    <p>
        <label for="upload-external-url">External URL:</label>
        <input id="upload-external-url" type="url" name="external_url" placeholder="https://example.com/file.pdf">
    </p>
    <p>
        <label for="upload-folder">Folder:</label>
        <select id="upload-folder" name="folder_id">
            <option value="">Root</option>
            {% for folder in upload_folders %}
                <option value="{{ folder.id }}">{{ folder.path }}</option>
            {% endfor %}
        </select>
    </p>
    <p>
        <label for="upload-description">Description:</label>
        <textarea id="upload-description" name="description"></textarea>
    </p>
    <p>
        <label for="upload-labels">Labels:</label>
        <select id="upload-labels" name="labels" multiple>
            {% for label in upload_labels %}
                <option value="{{ label.id }}">{{ label.name }}</option>
            {% endfor %}
        </select>
    </p>
    <button id="upload-button" type="submit">Upload</button>
</form>
<p id="upload-message" aria-live="polite"></p>
<section id="recent-upload-section" hidden>
    <h4>Recently uploaded</h4>
    <ul id="uploaded-file-list"></ul>
</section>

<script>
    const uploadForm = document.getElementById("upload-form");
    const uploadButton = document.getElementById("upload-button");
    const uploadMessage = document.getElementById("upload-message");
    const recentUploadSection = document.getElementById("recent-upload-section");
    const uploadedFileList = document.getElementById("uploaded-file-list");

    function createFileItem(fileData) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.href = "/files/" + fileData.id + "/";
        link.textContent = fileData.name;
        item.appendChild(link);
        return item;
    }

    uploadForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const folderInput = document.getElementById("upload-folder");
        const formData = new FormData(uploadForm);
        const csrfToken = uploadForm.querySelector("[name=csrfmiddlewaretoken]").value;

        if (!document.getElementById("upload-file").files.length &&
            !document.getElementById("upload-external-url").value) {
            uploadMessage.textContent = "Choose a file or enter an external URL.";
            return;
        }

        uploadButton.disabled = true;
        uploadMessage.textContent = "Uploading...";

        try {
            const response = await fetch(uploadForm.action, {
                method: "POST",
                headers: {"X-CSRFToken": csrfToken},
                body: formData,
            });
            const result = await response.json();

            if (!response.ok) {
                const errors = Object.entries(result).flatMap(function ([field, messages]) {
                    const list = Array.isArray(messages) ? messages : [messages];
                    return list.map(function (message) {
                        return field + ": " + message;
                    });
                });
                throw new Error(errors.join(" "));
            }

            uploadMessage.textContent = result.name + " uploaded successfully.";
            if (!folderInput.value) {
                const emptyMessage = document.getElementById("empty-file-message");
                if (emptyMessage) emptyMessage.remove();

                document.getElementById("root-file-list").prepend(createFileItem(result));
            } else {
                uploadedFileList.prepend(createFileItem(result));
                recentUploadSection.hidden = false;
            }

            const usedStorage = document.getElementById("used-storage");
            usedStorage.textContent = Number(usedStorage.textContent) + result.size_bytes;
            uploadForm.reset();
        } catch (error) {
            uploadMessage.textContent = error.message;
        } finally {
            uploadButton.disabled = false;
        }
    });
</script>
