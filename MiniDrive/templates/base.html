<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MiniDrive{% endblock %}</title>
</head>
<body>
    <header>
        <h1>MiniDrive</h1>
        {% if request.user.is_authenticated %}
            <p>Welcome, {{ request.user.username }}</p>
        {% endif %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
