{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
    <h2>Log in</h2>

    {% if form.errors %}
        <p>Username or password is incorrect.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>
{% endblock %}
